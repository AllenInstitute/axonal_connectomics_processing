name: Docker Push
on:
  push:
    branches: [master,develop,develop_integrate]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: 'true'
        token: ${{secrets.RELEASE_HUB_SECRET}}
    - name: Build Docker image
      run: docker build .
