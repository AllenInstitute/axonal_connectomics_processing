name: Docker Push
on:
  push:
    branches: [master,develop,develop_integrate]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: 'true'
        token: ${{secrets.RELEASE_HUB_SECRET}}
    - name: Build Docker image
      run: docker build .

name: Docker Push
on:
  push:
    branches: [master, develop, develop_integrate, docker_test]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          submodules: 'true'
          token: ${{ secrets.RELEASE_HUB_SECRET }}

      - name: Build Docker image
        run: docker build -t myimage .

      - name: Run unit tests in container
        run: |
          docker run --rm myimage /bin/bash -c "
            pytest ac_deploy/repos/ac_segmentation/test"
