[project]
name = "axconn"
requires-python = ">3.8,<3.13"
dynamic = ["version"] 
dependencies = [
    # "numpy",
    # "more_itertools",
    "scikit-image"
]

[project.optional-dependencies]
test = [
    "coverage>=4.1",
    "mock>=2.0.0",
    "pep8>=1.7.0",
    # "pytest>4.6,<5.0",
    "pytest",
    "pytest-cov>=2.2.1",
    "pytest-pep8>=1.0.6",
    "pytest-xdist>=1.14",
    "flake8>=3.0.4",
    "pylint>=1.5.4",
    "jinja2",
    "ujson"
]
# pypi-build = [
#    "build",
#     "twine"
# ]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

# [tool.setuptools]
# py-modules = [
#     "asap"
# ]

# [tool.setuptools_scm]
# version_file = "asap/_version.py"

# some downgrades from pixi's expectations
[tool.pixi.system-requirements]
linux = "4.0.0"
libc = "2.27"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

# TODO switch to pixi dependencies like in https://github.com/prefix-dev/pixi/tree/main/examples/pixi-build/recursive-run-dependencies

[tool.pixi.pypi-dependencies]
acanalysis = {path = "repos/ac_reconstruction_analysis", editable=true}
ac_segmentation = {path = "repos/ac_segmentation", editable=true}
acpreprocessing = {path = "repos/axonal_connectomics", editable=true}

# conda-enabled features
[tool.pixi.feature.pixi-base.dependencies]
# gcc = ">=8.0.0"
# cython = "*"
# numpy = "*"
# pandas = "*"
# scipy = "*"
# imageio = "*"
# matplotlib = "*"
# h5py = "<=3.12.1"
scikit-image = "*"
# pybdv = "*"

[tool.pixi.feature.jupyterlab.dependencies]
jupyterlab = "*"

[tool.pixi.environments]
conda-env = ["pixi-base"]
jupyter = ["pixi-base", "jupyterlab"]
test = ["pixi-base", "test"]

[tool.pixi.feature.jupyterlab.tasks]
jlab = "jupyter lab"

